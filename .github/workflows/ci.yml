# Root monorepo CI. GitHub Actions only reads .github/workflows at the REPO ROOT — the
# legacy hivepos-web/.github/workflows/ci.yml lived in a subdir (a merge leftover) and never ran.
# This file replaces it and adds the missing Go (hivepos-api) gate. Both jobs run on push to main
# and on PRs; path filters can be added later if CI minutes matter.
# No untrusted input (github.event.*) is interpolated into any run: step.

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write   # GHCR push (GITHUB_TOKEN)

jobs:
  api:
    name: hivepos-api (go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hivepos-api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: hivepos-api/go.sum

      - run: go vet ./...
      - run: go test ./...
      - run: go build ./...

      - name: Vulnerability scan (govulncheck)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Login to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build always (proves the image builds); push :latest + :sha-<short> only on main.
      - name: Build & push api image (GHCR)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployments/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/hivepos-api:latest
            ghcr.io/${{ github.repository_owner }}/hivepos-api:sha-${{ github.sha }}

  web:
    name: hivepos-web (next)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hivepos-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hivepos-web/package-lock.json

      - run: npm ci

      - name: Contract drift guard
        run: npm run gen:contract:check

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Build (standalone)
        run: npm run build

      - name: Login to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build always (proves the image builds); push :latest + :sha-<short> only on main.
      # Host auto-deploy: run watchtower on the prod box pulling ghcr.io/metabbe3/*:latest.
      # ponytail: SSH/blue-green deploy not wired — watchtower pull-restart is the simple path;
      # swap for SSH + compose roll when zero-downtime / health-gated rollout is needed.
      - name: Build & push web image (GHCR)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/hivepos-web:latest
            ghcr.io/${{ github.repository_owner }}/hivepos-web:sha-${{ github.sha }}
