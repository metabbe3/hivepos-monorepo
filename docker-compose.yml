# hivePOS — unified docker-compose (replaces pos-saas on :3007)
# web (Next.js) + api (Go) + postgres + caddy (single origin on :3007)
services:
  web:
    build:
      context: ./hivepos-web
      args:
        NEXT_PUBLIC_API_BASE_URL: /api
        NEXT_PUBLIC_MIDTRANS_CLIENT_KEY: ${MIDTRANS_CLIENT_KEY}
        NEXT_PUBLIC_MIDTRANS_ENV: ${MIDTRANS_ENV:-production}
        NEXT_PUBLIC_GOOGLE_OAUTH_ENABLED: "true"
        NEXT_PUBLIC_GA_ID: ${NEXT_PUBLIC_GA_ID:-}
    image: hivepos-web:latest
    environment:
      NEXT_PUBLIC_API_BASE_URL: /api
      API_BASE_URL_SSR: http://api:8080/api
      NODE_ENV: production
    expose: ["3000"]
    depends_on: [api]
    restart: unless-stopped
    # Self-heal: if Next hangs, Docker restarts the container. Node 18+ has global fetch.
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  api:
    build:
      context: ./hivepos-api
      dockerfile: deployments/Dockerfile
    image: hivepos-api:latest
    environment:
      DATABASE_URL: postgresql://posadmin:poslocal@postgres:5432/pos_saas?sslmode=disable
      JWT_SECRET: ${AUTH_SECRET}
      PORT: "8080"
      MIDTRANS_SERVER_KEY: ${MIDTRANS_SERVER_KEY}
      MIDTRANS_CLIENT_KEY: ${MIDTRANS_CLIENT_KEY}
      MIDTRANS_ENV: ${MIDTRANS_ENV:-production}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: http://localhost:3007/api/auth/google/callback
      WEB_ORIGIN: http://localhost:3007
      APP_ENV: production
      WHATSAPP_GATEWAY_URL: http://whatsapp-gateway:3001
    expose: ["8080"]
    depends_on: [postgres]
    restart: unless-stopped
    # Self-heal: /api/health returns 503 when DB is down (or hangs) → wget exits
    # non-zero → Docker marks unhealthy → restarts (combined w/ restart:unless-stopped).
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  whatsapp-gateway:
    build: ./whatsapp-gateway
    image: hivepos-whatsapp-gateway:latest
    ports: ["3001:3001"]
    volumes:
      - ./whatsapp-gateway/auth-states:/app/auth-states
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    ports: ["5437:5432"]
    volumes:
      # Named volume, NOT a bind mount. PGDATA was previously bind-mounted into
      # ./pos-saas/data/postgres — a gitignored working-dir path. Any reset of
      # that dir (fresh clone, git clean, rm) made Postgres initdb a fresh empty
      # cluster on next `up` → silent total data loss. A named volume is owned by
      # Docker, decoupled from the working dir, survives `down` (only `down -v`
      # removes it), and git can never touch it.
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: posadmin
      POSTGRES_PASSWORD: poslocal
      POSTGRES_DB: pos_saas
      TZ: Asia/Jakarta
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U posadmin -d pos_saas"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Auto-backup sidecar: dumps pos_saas every 12h to ./backups (host-mounted,
  # gzipped SQL, 14-day retention). Travels with the stack — no host cron needed.
  # Restore: gunzip -c ./backups/pos_saas_<ts>.sql.gz | docker exec -i hivepos-postgres-1 psql -U posadmin -d pos_saas
  db-backup:
    image: postgres:17-alpine
    environment:
      PGHOST: postgres
      PGUSER: posadmin
      PGPASSWORD: poslocal
      PGDATABASE: pos_saas
      BACKUP_INTERVAL_SECONDS: "43200"   # 12h
      BACKUP_RETAIN_DAYS: "14"
    volumes:
      - ./backups:/backups
      - ./scripts/db-backup.sh:/db-backup.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/db-backup.sh"]
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports: ["3007:80"]
    volumes:
      - ./hivepos-web/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on: [web, api]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

# Named volume for Postgres data. Owned by Docker, decoupled from the working
# directory. Survives `docker compose down`; removed only by `down -v`.
volumes:
  pgdata:
