name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Contract drift guard
        run: npm run gen:contract:check

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Build (standalone)
        run: npm run build

      - name: Docker build
        run: docker build -t hivepos-web:ci .

      # ponytail: push to GHCR + deploy to host not wired. Fill registry login
      # (docker/login-action) + SSH/watchtower deploy steps once the target is
      # known. The Docker build above proves the image builds. See docs/deploy.md.
      - name: Image push + deploy (TODO)
        run: echo "push/deploy not wired yet — see docs/deploy.md"
