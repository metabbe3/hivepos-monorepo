  /reports/export:
    get:
      tags:
        - reports
      operationId: exportReport
      summary: Export a report as a CSV file (field,value rows)
      description: |
        Streams the requested report as CSV (`field,value` per leaf). `type`
        selects the report to export (default `revenue`). CSV layout flattens
        the report struct; PDF is not supported by this endpoint.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: type
          schema:
            type: string
            enum:
              - orders
              - revenue
              - expenses
              - profit
              - customers
              - services
              - commission
              - outstanding
              - piutang
              - inventory
              - financial
            default: revenue
          description: Report type to export.
        - $ref: "#/components/parameters/FromDate"
        - $ref: "#/components/parameters/ToDate"
        - $ref: "#/components/parameters/StartDateAlias"
        - $ref: "#/components/parameters/EndDateAlias"
        - $ref: "#/components/parameters/BranchId"
      responses:
        "200":
          description: CSV file
          headers:
            Content-Disposition:
              schema:
                type: string
              description: "`attachment; filename=\"report-<type>.csv\"`"
          content:
            text/csv:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /reports/financial-statement:
    get:
