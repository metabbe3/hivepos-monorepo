openapi: 3.0.3
info:
  title: hivePOS API
  version: 0.1.0
  description: |
    Single source of truth for the hivePOS frontend ↔ backend contract.

    - Authored here (spec-first) so both hivepos-web (TS) and hivepos-api (Go)
      build to the same shapes.
    // ponytail: owned in the web repo for now — relocate to hivepos-api once
    // it can emit OpenAPI (swag/oapi-codegen).
    - Every response uses the standard envelope:
        { success: true, data: T, meta?: {...} }
        { success: false, error: { code?, message } }
    - `npm run gen:contract` regenerates `lib/api/types.ts` + `docs/contracts/*.md`
      from this file. CI fails if generated files drift.
servers:
  - url: /api
    description: Same-origin via Caddy edge (default).
  - url: http://localhost:8080/api
    description: Direct to Go backend (local dev without Caddy).
security: []
tags:
  - name: account
    description: Current-user context and profile self-service.
  - name: attendance
    description: Staff clock-in/out, attendance events, and quick-staff creation.
  - name: auth
  - name: billing
    description: >
      Tenant-side SaaS billing (subscription status, Midtrans Snap checkout, promo validation, and
      the Midtrans webhook). NOT super-admin billing.
  - name: blog
  - name: branches
    description: Tenant-scoped outlets (branches), including printer + coverage config.
  - name: customers
    description: Customer registry, stats, and deposit transactions.
  - name: dashboard
    description: Read-only aggregate metrics, kanban pipeline, and heatmap.
  - name: demo
    description: Public demo entrypoint — returns shared seeded demo credentials.
  - name: expenses
    description: Expense entries + expense categories recorded against a branch.
  - name: health
  - name: inventory
    description: Stock items (supplies/consumables) and stock movements per branch.
  - name: orders
    description: Laundry order lifecycle (list, create, get, edit, status, payments).
  - name: pickup
    description: Pickup requests — customer pickup intake, scheduling, assignment, and conversion to orders.
  - name: printers
    description: Device-local printer endpoints (always return a helpful device-required error).
  - name: public
  - name: pwa
    description: Progressive Web App support (service-worker nonce).
  - name: reports
    description: Business intelligence reports (orders, revenue, PnL, etc.)
  - name: roles
    description: Tenant-scoped RBAC roles.
  - name: service-groups
    description: Groups that organize services within a branch + module (e.g. speed variants).
  - name: services
    description: Priced laundry services scoped to a branch + module (PER_KG / PER_ITEM / FLAT).
  - name: super-admin
    description: Cross-tenant platform administration (SUPER_ADMIN gated).
  - name: tenant
    description: Tenant self-management — onboarding, website, WhatsApp templates, referral.
  - name: tickets
    description: Tenant support tickets — list, detail, replies, unread badge, CSAT.
  - name: track
    description: Public (unauthenticated) customer order tracking by order number.
  - name: users
    description: Tenant staff users (the users-module `User`, distinct from auth/account users).
  - name: whatsapp
    description: >
      WhatsApp gateway proxy (Baileys microservice). Three-layer gate: global `whatsappAutomation`
      feature flag + tenant `settings.whatsappEnabled` + per-tenant auto-send toggles. The API wraps
      the gateway's raw response in the `{success, data}` envelope before returning to the FE.
paths:
  /attendance/clock:
    post:
      tags:
        - attendance
      operationId: clockAttendance
      summary: Toggle a clock-in/out event
      description: |
        Verifies the supplied PIN against the stored bcrypt hash, then toggles
        a clock event. If the previous event was a `CLOCK_IN` on a prior day,
        the stale session is auto-closed at end-of-day before opening a fresh
        `CLOCK_IN` today. A wrong PIN returns 400 (the caller is already
        authenticated — 401 would trip client auth handling).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClockRequest"
      responses:
        "201":
          description: The created clock event.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceEventEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /attendance/events:
    get:
      tags:
        - attendance
      operationId: listAttendanceEvents
      summary: List clock events
      description: |
        Returns clock events as a bare array under `data` (unpaginated — the TS
        endpoint exposes no `meta`). Supports filtering by `userId`, `from`,
        `to`, and `branchId` (the last resolved from the auth context).
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: userId
          schema:
            type: string
          description: Filter to a single staff member.
        - in: query
          name: from
          schema:
            type: string
            format: date
          description: Inclusive lower bound (YYYY-MM-DD).
        - in: query
          name: to
          schema:
            type: string
            format: date
          description: Inclusive upper bound (YYYY-MM-DD).
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
          description: Normalized server-side; not surfaced in the response.
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
          description: Normalized server-side; not surfaced in the response.
      responses:
        "200":
          description: Clock events matching the filter (bare array).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceEventListEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags:
        - attendance
      operationId: createAttendanceEvent
      summary: Manually create a clock event
      description: |
        Manager override — records an event directly without a PIN check.
        `type` defaults to `CLOCK_IN` when omitted.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEventRequest"
      responses:
        "201":
          description: The created event.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceEventEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /attendance/events/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
        description: The clock event ID.
    patch:
      tags:
        - attendance
      operationId: updateAttendanceEvent
      summary: Update a clock event
      description: |
        Edits an existing event's `type` and/or `timestamp`. Returns
        `{ ok: true }` on success.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEventRequest"
      responses:
        "200":
          description: Update acknowledged.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    delete:
      tags:
        - attendance
      operationId: deleteAttendanceEvent
      summary: Delete a clock event
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Deleted — no content.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /attendance/quick-staff:
    post:
      tags:
        - attendance
      operationId: createQuickStaff
      summary: Create an attendance-only staff member
      description: |
        Creates a staff user that exists only for PIN-based clocking (no login
        credentials). `branchId` falls back to the auth context when omitted.
        The PIN is hashed with bcrypt before storage; the hash is never
        serialized back to the client.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuickStaffRequest"
      responses:
        "201":
          description: The created staff member.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffItemEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /attendance/staff:
    get:
      tags:
        - attendance
      operationId: listAttendanceStaff
      summary: List staff eligible to clock
      description: |
        Returns active staff members that have a PIN set, as a bare array under
        `data`. Each item carries only `id` and `name` (the clock grid needs
        nothing else). Branch context comes from the auth token.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Staff eligible to clock (bare array, unpaginated).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffItemListEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /attendance/status:
    get:
      tags:
        - attendance
      operationId: listAttendanceStatus
      summary: List who is currently clocked in
      description: |
        Per-staff today status: worked milliseconds (`todayMs`) and the open
        clock-in `since` timestamp (null when clocked out). Scoped to the
        tenant + branch from the auth context.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Staff clock status for today (bare array).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceStatusListEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /auth/callback/google:
    get:
      tags:
        - auth
      summary: Google OAuth callback (exchange code, mint JWT, redirect)
      description: |
        Google redirects here with `?code&state`. Verifies the query `state`
        against the signed `google_oauth_state` cookie (CSRF). If a valid
        `google_link` cookie is present, links the Google ID to that user and
        redirects to `/profile?linked=google`. Otherwise resolves/links-by-email
        via `GoogleLogin` and mints a login JWT, redirecting to
        `/login?googleToken=<jwt>`. If no account matches, redirects to
        `/register?googleEmail=...&googleName=...&googleId=...`.
      operationId: googleOAuthCallback
      security: []
      parameters:
        - in: query
          name: code
          required: true
          schema:
            type: string
          description: Authorization code from Google.
        - in: query
          name: state
          required: true
          schema:
            type: string
          description: CSRF state that must match the `google_oauth_state` cookie.
      responses:
        "302":
          description: Redirect to the frontend (login, register, or profile) with the resolved outcome.
          headers:
            Location:
              schema:
                type: string
                format: uri
              description: "`/login?googleToken=…`, `/register?google…`, or `/profile?linked=google`."
        "400":
          description: Invalid state or missing code.
        "502":
          description: Google token exchange or userinfo failed.
        "503":
          description: Google OAuth not configured on the server.
  /auth/google:
    get:
      tags:
        - auth
      summary: Start Google OAuth (redirect to consent screen)
      description: |
        Generates a random `state`, HMAC-signs it into a short-lived
        `google_oauth_state` cookie, and `302`-redirects the browser to Google's
        consent URL. Stashes the origin host in an `oauth_origin` cookie
        (Domain-scoped across subdomains) so the callback can redirect back to
        the tenant subdomain. The redirect_uri is always the platform domain
        (Google Console registers a fixed set).
      operationId: startGoogleOAuth
      security: []
      responses:
        "302":
          description: Redirect to Google's OAuth consent screen.
          headers:
            Location:
              schema:
                type: string
                format: uri
              description: Google authorization URL.
            Set-Cookie:
              schema:
                type: string
              description: "`google_oauth_state` and `oauth_origin` cookies (HMAC-signed, HttpOnly)."
        "503":
          description: Google OAuth not configured on the server.
  /auth/google/link:
    post:
      tags:
        - auth
      summary: Start linking Google to the logged-in user
      description: |
        Bearer-gated. Stashes a signed `google_link` cookie carrying the caller's
        userID + state, then returns the Google consent URL. After Google
        redirects back through `/auth/callback/google`, the callback detects the
        link cookie and attaches the Google ID to this user (instead of logging
        in).
      operationId: startGoogleLink
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Consent URL ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoogleOAuthLinkEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          description: Google OAuth not configured on the server.
  /auth/google/unlink:
    delete:
      tags:
        - auth
      summary: Remove the Google link from the logged-in user
      description: Clears the caller's `googleId`/avatar so they can no longer authenticate via Google OAuth.
      operationId: unlinkGoogle
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Google link removed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/login:
    post:
      tags:
        - auth
      summary: Email + password login → JWT
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Credentials accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponseEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/logout:
    post:
      tags:
        - auth
      summary: Clear all session cookies
      description: |
        Drops the legacy `next-auth.session-token` and `__Secure-next-auth.session-token`
        cookies so a tenant logout also tears down any surviving super-admin cookie
        session. The web client's `signOut()` calls this after clearing its own
        localStorage JWT. Bearer-gated (the caller is logged in at call time).
      operationId: logout
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Cookies cleared.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/me:
    get:
      tags:
        - auth
      summary: Current user + resolved claims
      operationId: getMe
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current session context.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/session-version:
    post:
      tags:
        - auth
      summary: Bump session version (force token refresh)
      operationId: bumpSessionVersion
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Session version bumped.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionVersionEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
    get:
      tags:
        - auth
      summary: Get the caller's current session version
      description: |
        Returns the caller's current `sessionVersion` (no bump). `useSessionSync`
        polls this to detect admin-triggered permission reloads and force a token
        refresh when it diverges from the JWT claim.
      operationId: getSessionVersion
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current session version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionVersionEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /billing/checkout:
    post:
      tags:
        - billing
      summary: Create a Midtrans Snap transaction for a plan purchase
      description: >
        Resolves the plan (by `planTier` GROWTH/PRO, or `planId` for back-compat), computes `outlets
        × price × months`, optionally applies a promo code, records a PENDING `SaaSPayment`, and
        returns a Midtrans `snapToken` the FE uses to open Snap. When no Midtrans server key is
        configured the API returns a mock token (dev fallback). Returns 201 on success.
      operationId: createBillingCheckout
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckoutInput"
      responses:
        "201":
          description: Checkout result containing the Snap token.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/EnvelopeSuccess"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/CheckoutResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /billing/promo/validate:
    post:
      tags:
        - billing
      summary: Validate a promo code against a plan
      description: >
        Checks a promo code for existence, active state, expiry, and redemption limit. Returns
        `{valid, type, value, promoCodeId}` on success or a `{valid: false, reason}` rejection. Does
        NOT redeem — redemption happens only on a PAID payment.
      operationId: validateBillingPromo
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PromoValidateInput"
      responses:
        "200":
          description: Promo validation result (always 200, even when invalid).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/EnvelopeSuccess"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/PromoResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /billing/status:
    get:
      tags:
        - billing
      summary: Get the current tenant's billing/subscription status
      description: >
        Returns the full `BillingStatus` shape: tenant info, subscription state, per-outlet list +
        usage vs plan limits, real per-outlet pricing from the Plan table (GROWTH/PRO), and trial
        end timestamp. Powers the billing page.
      operationId: getBillingStatus
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Billing status.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/EnvelopeSuccess"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/BillingStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /billing/webhook:
    post:
      tags:
        - billing
      summary: Midtrans payment notification webhook (PUBLIC, no auth)
      description: >
        Receives Midtrans transaction notifications. Verifies the HMAC-SHA512 signature (order_id +
        status_code + gross_amount + server_key); in dev without a server key, requires a non-empty
        `signature_key`. On capture/settlement/success: marks the matching SaaSPayment PAID and
        extends the subscription by `monthsPurchased`. Idempotent — a duplicate notification for an
        already-PAID payment is a no-op. Input is the raw Midtrans body (snake_case keys); no auth,
        no envelope on the request side.
      operationId: handleBillingWebhook
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MidtransWebhookInput"
      responses:
        "200":
          description: Webhook accepted.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/EnvelopeSuccess"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          ok:
                            type: boolean
                            example: true
        "400":
          $ref: "#/components/responses/BadRequest"
  /branches:
    get:
      tags:
        - branches
      summary: List branches for the active tenant
      description: |
        Returns the curated `BranchListItem` DTO list (a subset of the entity
        plus per-branch `counts`), unpaginated. Filters by `search` (name) and
        `active` (`true`/`false`).
      operationId: listBranches
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: search
          schema:
            type: string
          description: Case-insensitive name substring.
        - in: query
          name: active
          schema:
            type: boolean
          description: Filter by `isActive`.
      responses:
        "200":
          description: Branches (bare array under `data`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BranchListEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Missing tenant context.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    post:
      tags:
        - branches
      summary: Create a branch (outlet) for the active tenant
      description: |
        Creates a `Branch`. `name` is required. Defaults: `isActive`=`true`,
        `printerPort`=`9100`, `printerPaperSize`=`58mm`, `printerEnabled`=`false`,
        `isFreeTier`=`false`, `workDays`=`[1,2,3,4,5,6]`. `coverageEnd` is null on
        create (set via PATCH). Subject to the tenant's outlet (plan) limit.
      operationId: createBranch
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBranchInput"
      responses:
        "201":
          description: Created branch.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BranchEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Missing tenant context, or outlet (plan) limit reached.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /branches/{id}:
    parameters:
      - $ref: "#/components/parameters/BranchId"
    get:
      tags:
        - branches
      summary: Get a branch by ID
      operationId: getBranch
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Branch.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BranchEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags:
        - branches
      summary: Update a branch
      description: |
        Merges the supplied fields into the existing `Branch` (decoded directly
        onto the entity). The path `id` is authoritative.
      operationId: updateBranch
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBranchInput"
      responses:
        "200":
          description: Updated branch.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BranchEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags:
        - branches
      summary: Delete a branch
      operationId: deleteBranch
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /customers:
    get:
      tags:
        - customers
      summary: List customers for the current tenant
      description: |
        Returns the curated customer DTO list (with order aggregates + derived
        `customerStatus`) as a bare array under `data`. Intentionally unpaginated
        to match the original TS `/api/customers` contract. Supports `branchId`,
        `search`, `status`, `sort`, and `order` query filters.
      operationId: listCustomers
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: branchId
          schema:
            type: string
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: status
          schema:
            type: string
            enum:
              - NEW
              - ACTIVE
              - AT_RISK
              - LAPSED
        - in: query
          name: sort
          schema:
            type: string
        - in: query
          name: order
          schema:
            type: string
            enum:
              - asc
              - desc
      responses:
        "200":
          description: Customer list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerListEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags:
        - customers
      summary: Create a customer
      operationId: createCustomer
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: X-Client-Id
          required: false
          schema:
            type: string
          description: |
            Optional idempotency key. When set, returns the existing customer
            instead of creating a duplicate.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerCreateInput"
      responses:
        "201":
          description: Customer created (or returned idempotently for an existing `clientId`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: A customer with the given phone already exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /customers/{id}:
    get:
      tags:
        - customers
      summary: Get a customer by ID (with order/payment history)
      operationId: getCustomer
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CustomerId"
      responses:
        "200":
          description: The customer, including embedded `orders` history.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerDetailEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags:
        - customers
      summary: Update customer fields
      description: |
        Partial update. The server loads the existing customer, JSON-decodes the
        body over it, re-pins `id`, and persists. Omitted fields are left as-is.
      operationId: updateCustomer
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CustomerId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerUpdateInput"
      responses:
        "200":
          description: Updated customer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags:
        - customers
      summary: Delete a customer
      description: |
        Blocked (non-204) when business rules forbid deletion, e.g. the customer
        still has orders. The error body carries the rule code/message.
      operationId: deleteCustomer
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CustomerId"
      responses:
        "204":
          description: Deleted — no content.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /customers/{id}/deposit:
    get:
      tags:
        - customers
      summary: List a customer's deposit transactions
      operationId: listCustomerDeposits
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CustomerId"
      responses:
        "200":
          description: Deposit transactions (bare array under `data`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerDepositListEnvelope"
