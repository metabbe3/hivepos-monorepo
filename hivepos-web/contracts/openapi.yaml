                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ReportFinancialStatement"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /reports/inventory:
    get:
      tags:
        - reports
      operationId: getReportInventory
      summary: Inventory report (stock levels + recent movements)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Inventory report
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/EnvelopeSuccess"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ReportInventory"
        "400":
          $ref: "#/components/responses/BadRequest"
