          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /expenses/{id}:
    get:
      tags:
        - expenses
      summary: Get an expense by ID
      operationId: getExpense
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ExpenseId"
      responses:
        "200":
          description: The expense, including the embedded `category` when set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExpenseEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags:
        - expenses
      summary: Update expense fields
      description: |
        Partial update. The server loads the existing expense, applies the body
        fields (`amount`, `description`, `categoryId`, `date`), and persists.
        `date` is accepted as `YYYY-MM-DD` or RFC3339 (the FE `<input type="date">`
        sends date-only). Omitted fields are left as-is.
      operationId: updateExpense
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ExpenseId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpenseUpdateInput"
      responses:
        "200":
          description: Updated expense.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExpenseEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags:
