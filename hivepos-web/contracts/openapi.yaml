            type: integer
            minimum: 1
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 200
      responses:
        "200":
          description: Expense category list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExpenseCategoryListEnvelope"
