      tags:
        - inventory
      summary: Create a stock item in the active branch
      description: |
        Creates a `StockItem` scoped to the session branch. `name` and `unit`
        are required; omitted numeric fields default to `0`, `isActive` defaults
        to `true`.
      operationId: createStockItem
      security:
        - bearerAuth: []
