    UserProfile:
      type: object
      description: The current user's editable profile, including Google link state.
      properties:
        id:
          type: string
        name:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        role:
          type: string
          example: OWNER
        createdAt:
          type: string
          format: date-time
          description: RFC3339 UTC timestamp.
        googleId:
          type: string
          nullable: true
          description: Google OAuth sub when the account is linked to Google; null otherwise.
        avatar:
          type: string
          format: uri
          nullable: true
          description: Google profile picture URL when linked; null otherwise.
      required:
        - id
        - role
        - createdAt
    UserProfileEnvelope:
      allOf:
        - $ref: "#/components/schemas/EnvelopeSuccess"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/UserProfile"
    WebsiteConfig:
      type: object
      description: |
        Website configuration returned by `GET/PATCH /tenant/website`. `settings`
        is the `settings.website` JSON object (tagline, hero photo, FAQs, etc.)
        and may be `{}` when unset.
      properties:
        plan:
          type: string
          description: Always `PRO`.
        slug:
          type: string
        websiteEnabled:
          type: boolean
        websitePublishedAt:
          type: string
          nullable: true
          description: Millis-precision UTC (`YYYY-MM-DDTHH:mm:ss.sssZ`) or null.
        subdomain:
          type: string
          description: "`<slug>.hivepos.id`."
        settings:
          type: object
          additionalProperties: true
          description: Free-form website content settings.
      required:
        - plan
        - slug
        - websiteEnabled
        - subdomain
        - settings
    WebsiteConfigEnvelope:
      allOf:
        - $ref: "#/components/schemas/EnvelopeSuccess"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/WebsiteConfig"
    WebsiteInput:
      type: object
      description: |
        Body for `PATCH /tenant/website`. Every field is an optional nullable
        pointer — omitted fields are left unchanged. `areaServed`, `faqs`, and
        `testimonials` accept arbitrary JSON.
      properties:
        tagline:
          type: string
          nullable: true
        heroPhotoUrl:
          type: string
          nullable: true
        about:
          type: string
          nullable: true
        instagram:
          type: string
          nullable: true
        qrisImageUrl:
          type: string
          nullable: true
        googleRating:
          type: number
          format: double
          nullable: true
        googleReviewCount:
          type: integer
          nullable: true
        yearEstablished:
          type: integer
          nullable: true
        avgProcessingMinutes:
          type: integer
          nullable: true
        areaServed:
          nullable: true
          description: Arbitrary JSON (array of strings or object).
        faqs:
          nullable: true
          description: Arbitrary JSON (array of FAQ objects).
        testimonials:
          nullable: true
          description: Arbitrary JSON (array of testimonial objects).
        enabled:
          type: boolean
          nullable: true
    WhatsAppConnectInput:
      type: object
      description: Body forwarded to the gateway connect endpoint (opaque).
      additionalProperties: true
    WhatsAppConnectResult:
      type: object
      description: Result returned by the gateway connect endpoint (opaque).
      additionalProperties: true
    WhatsAppDisconnectInput:
      type: object
      description: Body forwarded to the gateway disconnect endpoint (opaque).
      additionalProperties: true
    WhatsAppDisconnectResult:
      type: object
      description: Result returned by the gateway disconnect endpoint (opaque).
      additionalProperties: true
    WhatsAppQR:
      type: object
      description: QR pairing payload from the Baileys gateway (opaque shape).
      additionalProperties: true
    WhatsAppSendInput:
      type: object
      description: >
        Message send body. Matches the gateway contract used by both this endpoint and the internal
        `SendAsync(phone, message)` helper.
      required:
        - phone
        - message
      properties:
        phone:
          type: string
          description: Recipient phone number (E.164 or gateway-accepted format).
          example: "6281234567890"
        message:
          type: string
          description: Message body text.
      additionalProperties: true
    WhatsAppSendResult:
      type: object
      description: Result returned by the gateway send endpoint (opaque).
      additionalProperties: true
    WhatsAppStatus:
      type: object
      description: >
        Connection status returned by the Baileys gateway. Field names are defined by the gateway
        service (hivepos-api forwards the body verbatim inside the envelope); treat as an opaque
        gateway payload.
      additionalProperties: true
    WhatsAppTemplates:
      type: object
      description: |
        WhatsApp template catalog. `overrides` are tenant customizations,
        `defaults` the system catalog, `effective` = defaults merged with
        overrides, and `manifest` the static template descriptor array.
      properties:
        overrides:
          type: object
          additionalProperties:
            type: string
        defaults:
          type: object
          additionalProperties:
            type: string
        effective:
          type: object
          additionalProperties:
            type: string
        manifest:
          type: array
          description: Static descriptor list (id, label, category, variables, defaultBody, maxLength).
          items:
            type: object
            additionalProperties: true
      required:
        - overrides
        - defaults
        - effective
        - manifest
    WhatsAppTemplatesEnvelope:
      allOf:
        - $ref: "#/components/schemas/EnvelopeSuccess"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/WhatsAppTemplates"
  parameters:
    CustomerId:
