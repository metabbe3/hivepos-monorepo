        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantOnboardingInput"
      responses:
        "200":
          description: Onboarding updated; returns the tenant profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantProfileEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /tenant/referral:
    get:
      tags:
        - tenant
      summary: Get the tenant referral code and usage stats
      description: |
        Returns the tenant's referral code, a ready-to-share URL, and counts of
        rewarded vs pending referrals against the reward cap (12) of 1-month
        rewards each.
      operationId: getTenantReferral
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Referral info.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantReferralInfoEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /tenant/website:
    get:
      tags:
        - tenant
      summary: Get the tenant website configuration
      description: |
        Returns the public-website config: plan, slug/subdomain, publish state,
        and the `settings.website` JSON object (may be `{}` when unset).
      operationId: getTenantWebsite
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Website config.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebsiteConfigEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      tags:
        - tenant
      summary: Update tenant website settings
      description: |
        Merges the provided fields into `settings.website`; omitted fields are
        left unchanged. All fields are optional (nullable pointers). Returns the
        full website config after the merge.
      operationId: updateTenantWebsite
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebsiteInput"
      responses:
        "200":
          description: Website config after update.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebsiteConfigEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      tags:
        - tenant
      summary: Disable the tenant website
      description: |
        Unpublishes the website: clears `websiteEnabled` and `websitePublishedAt`.
        Stored website settings are retained. Returns 204 No Content.
      operationId: deleteTenantWebsite
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Website disabled.
        "401":
          $ref: "#/components/responses/Unauthorized"
  /tenant/whatsapp-templates:
    get:
      tags:
        - tenant
      summary: Get WhatsApp message templates
      description: |
        Returns the template catalog: `overrides` (tenant customizations),
        `defaults` (system defaults), `effective` (defaults overridden by
        tenant overrides), and the static `manifest` describing available
        templates, variables, and length limits.
      operationId: getTenantWhatsAppTemplates
      security:
        - bearerAuth: []
      responses:
        "200":
          description: WhatsApp templates.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhatsAppTemplatesEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      tags:
        - tenant
      summary: Override WhatsApp message templates
      description: |
        Replaces the tenant's template `overrides` (stored under
        `settings.whatsappTemplates`). The request body is a full
        `WhatsAppTemplates` object; only `overrides` are persisted, but the same
        shape is returned. Returns the stored templates object.
      operationId: updateTenantWhatsAppTemplates
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WhatsAppTemplates"
      responses:
        "200":
          description: Templates after update.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhatsAppTemplatesEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /tickets:
    get:
      tags:
        - tickets
      summary: List tickets for the current user or tenant
      description: |
        Returns tickets the caller submitted OR that belong to their tenant,
        newest first. Intentionally unpaginated to match the original TS contract.
      operationId: listTickets
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Ticket summary list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketListEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags:
        - tickets
      summary: Create a support ticket
      description: |
        Creates an `OPEN` ticket. The submitter snapshot (name/email/phone) is
        refreshed from the `User` row; `category` defaults to `OTHER` and
        `priority` defaults to `NORMAL` when omitted. Returns the new ticket id.
      operationId: createTicket
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantTicketCreateInput"
      responses:
        "201":
          description: Ticket created.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/EnvelopeSuccess"
                  - type: object
                    properties:
                      data:
                        type: object
                        description: "`{ id }` of the created ticket."
                        properties:
                          id:
                            type: string
                        required:
                          - id
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /tickets/unread:
    get:
      tags:
        - tickets
      summary: Unread ticket events for the current user
      description: |
        Returns admin-side `ticket.*` audit-log events authored by other users
        since the caller's `lastTicketEventReadAt`. Capped at the 5 most recent.
        `events` may be empty; `lastReadAt` is null until the user first marks read.
      operationId: getTicketUnread
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Unread ticket event summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketUnreadEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags:
        - tickets
      summary: Mark all ticket events as read
      description: |
        Stamps `lastTicketEventReadAt = now()` on the calling user. Clears the
        unread badge. Takes no request body.
      operationId: markTicketUnreadRead
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Read marker updated.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/EnvelopeSuccess"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          ok:
                            type: boolean
                            enum:
                              - true
                        required:
                          - ok
        "401":
          $ref: "#/components/responses/Unauthorized"
  /tickets/{id}:
    get:
      tags:
        - tickets
      summary: Get a ticket with its comments
      description: |
        Full ticket detail including the comment thread (oldest first). Access is
        scoped to the submitter or members of the same tenant; cross-tenant
        access returns 403.
      operationId: getTicket
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TicketId"
      responses:
        "200":
          description: Ticket detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantTicketDetailEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Caller is not the submitter nor in the same tenant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          $ref: "#/components/responses/NotFound"
  /tickets/{id}/comments:
    post:
      tags:
        - tickets
      summary: Add a tenant reply to a ticket
      description: |
        Appends a `TENANT_USER` comment and, if the ticket was `RESOLVED` or
        `CLOSED`, reopens it to `OPEN` (clearing `resolvedAt`). Returns the
        created comment.
      operationId: addTicketComment
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TicketId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TicketCommentInput"
      responses:
        "201":
          description: Comment added (ticket may have been reopened).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketCommentEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Caller is not the submitter nor in the same tenant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          $ref: "#/components/responses/NotFound"
  /tickets/{id}/csat:
    post:
      tags:
        - tickets
      summary: Rate a resolved/closed ticket (CSAT)
      description: |
        The original submitter may rate a `RESOLVED` or `CLOSED` ticket exactly
        once. Subsequent attempts, non-submitter callers, or rating an
        in-progress ticket all return 403. Returns `{ id, csatRating }`.
      operationId: setTicketCsat
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TicketId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TicketCsatInput"
      responses:
        "200":
          description: CSAT recorded.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/EnvelopeSuccess"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          id:
                            type: string
                          csatRating:
                            type: integer
                        required:
                          - id
                          - csatRating
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Not the submitter, ticket not resolved, or already rated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          $ref: "#/components/responses/NotFound"
  /track/{orderNumber}:
    get:
      tags:
        - track
      summary: Track an order by order number
      description: |
        Public (unauthenticated) customer-facing order tracking. Returns the
        order's status, payment status, total, line items, and creation
        timestamp. 404 when the order number does not exist.
      operationId: trackOrder
      security: []
      parameters:
        - $ref: "#/components/parameters/OrderNumber"
      responses:
        "200":
          description: Order tracking snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderTrackingEnvelope"
        "404":
          $ref: "#/components/responses/NotFound"
  /track/{orderNumber}/photos:
    get:
      tags:
        - track
      summary: List public photos for an order
      description: |
        Public (unauthenticated) photo list for customer order tracking.
        Returns a bare array of `{ id, url }` ordered by photo `createdAt`.
      operationId: trackOrderPhotos
      security: []
      parameters:
        - $ref: "#/components/parameters/OrderNumber"
      responses:
        "200":
          description: Photo list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderPhotoListEnvelope"
  /user:
    get:
      tags:
        - account
      summary: Lightweight current-user context
      description: |
        Returns the caller's `id`, `name`, `email`, `phone`, `role`, `branchId`,
        and `tenantId`. Used by the receipt + printer-settings pages to resolve
        the active branch.
      operationId: getCurrentUser
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user context.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountUserEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /user/profile:
    get:
      tags:
        - account
      summary: Get the current user's editable profile
      description: Returns the caller's profile, including `googleId`/`avatar` link state and `createdAt`.
      operationId: getUserProfile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The current user's profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfileEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags:
        - account
      summary: Update name/phone and/or change password
      description: |
        Partial update. `name` and `phone` are optional (send `phone: ""` to
        clear). To change the password, send `newPassword` together with
        `currentPassword` (verified server-side via bcrypt); a missing/wrong
        current password yields a 400 validation error. On success the handler
        echoes back the updated profile (same shape as `GET /user/profile`).
      operationId: updateUserProfile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileInput"
      responses:
        "200":
          description: Updated profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfileEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /users:
    get:
      tags:
        - users
      summary: List staff users for the current tenant
      description: |
        Returns the curated user DTO list (with nested `branch` + `roleRef`) as a
        bare array under `data`. Intentionally unpaginated to match the original
        TS `/api/users` contract. Supports `branchId`, `search`, and `role`
        query filters.
      operationId: listStaffUsers
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: branchId
          schema:
            type: string
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: role
          schema:
            type: string
      responses:
        "200":
          description: Staff user list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffUserListEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags:
        - users
      summary: Create a staff user
      description: |
        Creates a tenant user. `role` (the OWNER/MANAGER/EMPLOYEE enum) is
        derived from the selected `roleId`'s name when omitted (defaults to
        EMPLOYEE). When provided, `pin` must be at least 4 digits. Subject to
        plan-limit enforcement on the `users` resource (403 when exceeded).
      operationId: createStaffUser
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffUserCreateInput"
      responses:
        "201":
          description: Staff user created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffUserEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /users/{id}:
    get:
      tags:
        - users
      summary: Get a staff user by ID
      operationId: getStaffUser
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/StaffUserId"
      responses:
        "200":
          description: The staff user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffUserEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags:
        - users
      summary: Update staff user fields
      description: Partial update — send only the fields to change.
      operationId: updateStaffUser
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/StaffUserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffUserUpdateInput"
      responses:
        "200":
          description: Acknowledgement that the update was applied.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags:
        - users
      summary: Delete a staff user
      description: Blocked (400) when a user attempts to delete their own account.
      operationId: deleteStaffUser
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/StaffUserId"
      responses:
        "204":
          description: Deleted — no content.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /users/{id}/pin:
    patch:
      tags:
        - users
      summary: Set (or reset) a staff user's PIN
      description: "Hashes and stores a new PIN. `pin` must be at least 4 digits. Returns `{ ok: true }`."
      operationId: setStaffUserPin
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/StaffUserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffUserSetPinInput"
      responses:
        "200":
          description: PIN stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /users/{id}/reset-password:
    post:
      tags:
        - users
      summary: Generate a one-time temp password for a staff user
      description: |
        Owner-initiated reset. Generates a random temp password, hashes and
        stores it, and bumps `sessionVersion` to invalidate the staff's current
        session. Returns the plain temp once (`{ tempPassword }`) so the owner
        can hand it over out-of-band. Requires `users:edit`.
      operationId: resetStaffUserPassword
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/StaffUserId"
      responses:
        "200":
          description: Temp password generated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffUserResetPasswordEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /whatsapp/connect:
    post:
      tags:
        - whatsapp
      summary: Initiate a WhatsApp session for the current tenant
      description: >
        Proxies `POST <gateway>/:tenantId/connect`. Boots a Baileys session and begins QR pairing.
        The request body is forwarded verbatim to the gateway.
      operationId: connectWhatsApp
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WhatsAppConnectInput"
      responses:
        "200":
          description: Connect result (gateway-defined shape, wrapped in envelope).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/EnvelopeSuccess"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/WhatsAppConnectResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "502":
          description: WhatsApp gateway unreachable.
        "503":
          description: Circuit breaker open (gateway degraded).
  /whatsapp/disconnect:
    post:
      tags:
        - whatsapp
      summary: Tear down the WhatsApp session for the current tenant
      description: >
        Proxies `POST <gateway>/:tenantId/disconnect`. Logs the Baileys session out and clears the
        stored credentials.
      operationId: disconnectWhatsApp
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WhatsAppDisconnectInput"
      responses:
        "200":
          description: Disconnect result (gateway-defined shape, wrapped in envelope).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/EnvelopeSuccess"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/WhatsAppDisconnectResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "502":
          description: WhatsApp gateway unreachable.
        "503":
          description: Circuit breaker open (gateway degraded).
  /whatsapp/qr:
    get:
      tags:
        - whatsapp
      summary: Get the pairing QR code for the current tenant
      description: >
        Proxies `GET <gateway>/:tenantId/qr`. Returns the QR payload used to link a WhatsApp device
        via Baileys. Wrapped in the standard envelope.
      operationId: getWhatsAppQR
      security:
        - bearerAuth: []
      responses:
        "200":
          description: QR payload (gateway-defined shape, wrapped in envelope).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/EnvelopeSuccess"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/WhatsAppQR"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "502":
          description: WhatsApp gateway unreachable.
        "503":
          description: Circuit breaker open (gateway degraded).
  /whatsapp/send:
    post:
      tags:
        - whatsapp
      summary: Send a WhatsApp message for the current tenant
      description: >
        Proxies `POST <gateway>/:tenantId/send`. Sends an ad-hoc message to a phone number.
        (Auto-send on order received / ready uses the internal `SendAsync` helper, not this
        endpoint.)
      operationId: sendWhatsAppMessage
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WhatsAppSendInput"
      responses:
        "200":
          description: Send result (gateway-defined shape, wrapped in envelope).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/EnvelopeSuccess"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/WhatsAppSendResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "502":
          description: WhatsApp gateway unreachable.
        "503":
          description: Circuit breaker open (gateway degraded).
  /whatsapp/status:
    get:
      tags:
        - whatsapp
      summary: Get WhatsApp connection status for the current tenant
      description: >
        Proxies `GET <gateway>/:tenantId/status`. Returns the Baileys session connection state
        (connected / disconnected / QR-pending). The gateway response body is wrapped in the
        standard `{success, data}` envelope by the API. Returns 403 if the tenant isn't whitelisted
        for WhatsApp.
      operationId: getWhatsAppStatus
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Connection status (gateway-defined shape, wrapped in envelope).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/EnvelopeSuccess"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/WhatsAppStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "502":
          description: WhatsApp gateway unreachable.
        "503":
          description: Circuit breaker open (gateway degraded).
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "`Authorization: Bearer <jwt>` — 24h, HS256."
  responses:
    BadRequest:
      description: Validation error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Unauthorized:
      description: Missing or invalid credentials.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Forbidden:
      description: Authenticated but not allowed (e.g. missing tenant context).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
    Conflict:
      description: |
        The resource is referenced by other records (e.g. a service is used by
        order items) and cannot be deleted until those are reassigned/removed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    AccountUser:
      type: object
      description: Lightweight current-user context (id, branchId, role).
      properties:
        id:
          type: string
        name:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        role:
          type: string
          example: OWNER
        branchId:
          type: string
          nullable: true
        tenantId:
          type: string
          nullable: true
      required:
        - id
        - role
    AccountUserEnvelope:
      allOf:
        - $ref: "#/components/schemas/EnvelopeSuccess"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/AccountUser"
    AiChatConfig:
      type: object
      properties:
        enabled:
          type: boolean
          description: "`true` when an AI key is configured."
        model:
          type: string
      required:
        - enabled
        - model
    AiChatConfigEnvelope:
      allOf:
        - $ref: "#/components/schemas/EnvelopeSuccess"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/AiChatConfig"
    AttendanceEvent:
      type: object
      description: A single clock-in/out record.
      properties:
        id:
          type: string
        userId:
          type: string
        userName:
          type: string
        branchId:
          type: string
        branchName:
          type: string
        type:
          type: string
          enum:
            - CLOCK_IN
            - CLOCK_OUT
        timestamp:
          type: string
          format: date-time
      required:
        - id
        - userId
        - userName
        - branchId
        - branchName
        - type
        - timestamp
    AttendanceEventEnvelope:
      allOf:
        - $ref: "#/components/schemas/EnvelopeSuccess"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/AttendanceEvent"
    AttendanceEventListEnvelope:
      allOf:
        - $ref: "#/components/schemas/EnvelopeSuccess"
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/AttendanceEvent"
    AttendanceStatus:
      type: object
      description: Per-staff today status from `/attendance/status`.
      properties:
        id:
          type: string
        name:
          type: string
        since:
          type: string
          nullable: true
          description: Open clock-in ISO timestamp
          null when clocked out.: null
        todayMs:
          type: integer
          format: int64
          description: Milliseconds worked today.
      required:
        - id
        - name
        - since
        - todayMs
    AttendanceStatusListEnvelope:
      allOf:
        - $ref: "#/components/schemas/EnvelopeSuccess"
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/AttendanceStatus"
    BillingLimits:
      type: object
      properties:
        isPaid:
          type: boolean
          description: Whether the tenant is on a paid plan.
        maxOrders:
          type: integer
          description: Monthly order cap (-1 / large value = unlimited).
        maxOutlets:
          type: integer
        maxUsers:
          type: integer
        planName:
          type: string
    BillingOutlet:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        coverageEnd:
          type: string
          format: date-time
          nullable: true
          description: Outlet coverage end timestamp, null when not covered.
        isFreeTier:
          type: boolean
        status:
          type: string
          description: Outlet billing status (e.g. active, locked, expiring).
        expiresInDays:
          type: integer
          nullable: true
          description: Days until coverage lapses; null when not applicable.
    BillingOverview:
      type: object
      description: domain.BillingOverview.
      properties:
        mrr:
          type: number
          format: double
        totalRevenue:
          type: number
          format: double
        pendingPayments:
          type: integer
          format: int64
        refundedTotal:
          type: number
          format: double
        paidThisMonth:
          type: number
          format: double
        lifetimeGross:
          type: number
          format: double
        paidTenantCount:
          type: integer
          format: int64
        activePaidOutlets:
          type: integer
          format: int64
        failedCount30d:
          type: integer
          format: int64
      required:
        - mrr
        - totalRevenue
        - pendingPayments
        - refundedTotal
        - paidThisMonth
        - lifetimeGross
        - paidTenantCount
        - activePaidOutlets
        - failedCount30d
    BillingPricing:
      type: object
      properties:
        originalUnitPrice:
          type: number
          format: double
          description: Pre-discount per-outlet price.
        unitPrice:
          type: number
          format: double
          description: Effective per-outlet price the tenant pays.
    BillingStatus:
      type: object
      description: >
        Full tenant billing snapshot — mirrors TS `/api/billing/status`. Drives the billing page:
        plan tier, limits, per-outlet usage, real Plan-table pricing, and trial end.
      properties:
        tenant:
          $ref: "#/components/schemas/BillingTenant"
        subscription:
          $ref: "#/components/schemas/BillingSub"
        outlets:
          type: array
          items:
            $ref: "#/components/schemas/BillingOutlet"
        activeCount:
          type: integer
          description: Number of active outlets.
        lockedCount:
          type: integer
          description: Number of locked (past-due / coverage-lapsed) outlets.
        expiringSoon:
          type: array
          description: Outlets whose coverage expires within the warning window.
          items: {}
        trialEndsAt:
          type: string
          format: date-time
          nullable: true
          description: Trial end timestamp (ISO 8601 UTC), null when not on trial.
        pricing:
          $ref: "#/components/schemas/BillingPricing"
        limits:
          $ref: "#/components/schemas/BillingLimits"
        payments:
          type: array
          description: Recent SaaS payment history (currently an open array).
          items: {}
        outletsUsed:
          type: integer
          description: Current outlet count (usage).
        usersUsed:
          type: integer
          description: Current user count (usage).
        ordersUsedMonth:
          type: integer
          description: Orders this month (usage vs `limits.maxOrders`).
        growthPrice:
          type: number
          format: double
          description: Real per-outlet GROWTH monthly price from the Plan table.
        proPrice:
          type: number
          format: double
          description: Real per-outlet PRO monthly price from the Plan table.
    BillingSub:
      type: object
      properties:
        status:
          type: string
          description: >
            Subscription lifecycle. One of TRIAL, ACTIVE, PAST_DUE, CANCELED, NONE (no subscription
            row yet).
          enum:
            - TRIAL
            - ACTIVE
            - PAST_DUE
            - CANCELED
            - NONE
        planName:
          type: string
          description: Resolved plan name (Free / GROWTH / PRO).
        currentPeriodEnd:
          type: string
          format: date-time
          nullable: true
          description: Current period end (ISO 8601 UTC), null when not set.
    BillingTenant:
      type: object
      properties:
        name:
          type: string
        slug:
          type: string
        ownerEmail:
          type: string
          format: email
        activeModules:
          type: array
          items:
            type: string
    BlogPost:
      type: object
      description: A published blog post. `content` is Markdown.
      properties:
        slug:
          type: string
        title:
          type: string
        description:
          type: string
          description: Meta description
        keywords:
          type: string
          nullable: true
          description: Comma-separated SEO keywords
        content:
          type: string
          description: Markdown source
        coverImage:
          type: string
          nullable: true
          format: uri
        publishedAt:
          type: string
          nullable: true
          format: date-time
      required:
        - slug
        - title
        - description
        - content
    BlogPostEnvelope:
      allOf:
        - $ref: "#/components/schemas/EnvelopeSuccess"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/BlogPost"
    BlogPostListEnvelope:
      allOf:
        - $ref: "#/components/schemas/EnvelopeSuccess"
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/BlogPost"
    Branch:
      type: object
      description: |
        The full branch/outlet entity. `operatingHours` and `pickupSlots` are
        free-form JSON columns; `workDays` is a list of weekday ints
        (1=Mon … 7=Sun).
      properties:
        id:
          type: string
        name:
          type: string
        address:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        invoiceFooter:
          type: string
          nullable: true
        isActive:
          type: boolean
        tenantId:
          type: string
        latitude:
          type: number
          format: double
          nullable: true
        longitude:
          type: number
          format: double
          nullable: true
        operatingHours:
          type: object
          nullable: true
          description: Free-form operating-hours JSON (shape preserved from DB).
        whatsappLink:
          type: string
          nullable: true
        googleMapsLink:
          type: string
          nullable: true
        printerHost:
          type: string
          nullable: true
        printerPort:
          type: integer
        printerName:
          type: string
          nullable: true
        printerEnabled:
          type: boolean
        printerLastSeen:
          type: string
          format: date-time
          nullable: true
        printerPaperSize:
          type: string
        coverageEnd:
          type: string
          format: date-time
          nullable: true
        isFreeTier:
          type: boolean
        slug:
          type: string
          nullable: true
        pickupSlots:
          type: object
          nullable: true
          description: Free-form pickup-slots JSON (shape preserved from DB).
        workDays:
          type: array
          items:
            type: integer
            format: int32
          description: Weekday ints (1=Mon … 7=Sun).
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - isActive
        - tenantId
        - printerPort
        - printerEnabled
        - printerPaperSize
        - isFreeTier
        - workDays
        - createdAt
        - updatedAt
    BranchCounts:
      type: object
      description: Per-branch aggregate counts (mirrors TS `BranchListItemDTO.counts`).
      properties:
        users:
          type: integer
          format: int64
        orders:
          type: integer
          format: int64
        services:
          type: integer
          format: int64
        customers:
          type: integer
          format: int64
      required:
        - users
        - orders
        - services
        - customers
    BranchEnvelope:
      allOf:
        - $ref: "#/components/schemas/EnvelopeSuccess"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/Branch"
    BranchListEnvelope:
      allOf:
        - $ref: "#/components/schemas/EnvelopeSuccess"
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/BranchListItem"
    BranchListItem:
      type: object
      description: |
        Curated list item for `/branches` (mirrors TS `BranchListItemDTO`):
        a subset of `Branch` plus per-branch `counts`. Unpaginated.
      properties:
        id:
          type: string
        name:
          type: string
        address:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        invoiceFooter:
          type: string
          nullable: true
        isActive:
          type: boolean
        isFreeTier:
          type: boolean
        coverageEnd:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        counts:
          $ref: "#/components/schemas/BranchCounts"
      required:
        - id
        - name
        - isActive
        - isFreeTier
        - createdAt
        - counts
    BranchRef:
      type: object
      description: Nested branch reference on a `StaffUserListItem`.
      properties:
        id:
          type: string
        name:
          type: string
      required:
        - id
        - name
    CashFlow:
      type: object
      properties:
        income:
          type: number
          format: double
        expenses:
          type: number
          format: double
        net:
          type: number
          format: double
        walletDeposits:
          type: number
          format: double
      required:
        - income
        - expenses
        - net
        - walletDeposits
    CheckoutInput:
      type: object
      description: Body for POST /billing/checkout.
      required:
        - planTier
      properties:
        planTier:
          type: string
          description: Plan tier to purchase (resolves to a Plan row).
          example: GROWTH
        branchIds:
          type: array
          description: Outlet IDs to bill for. At least 1 required.
          items:
            type: string
        months:
          type: integer
          minimum: 1
          maximum: 36
          description: Number of months to purchase (1–36).
        planId:
          type: string
          description: Accepted for back-compat when `planTier` is omitted.
        promoCode:
          type: string
          nullable: true
          description: Optional promo code to apply.
    CheckoutResult:
      type: object
      description: >
        Result of POST /billing/checkout. The FE opens Midtrans Snap using `snapToken` (NOT
        `token`). Shape mirrors the FE handleCheckout contract.
      properties:
        status:
          type: string
          description: Payment status. Always `PENDING` immediately after checkout.
          example: PENDING
        snapToken:
          type: string
          description: Midtrans Snap token (or `mock-snap-token-…` in dev without keys).
        redirectUrl:
          type: string
          format: uri
          description: Snap redirect URL.
        message:
          type: string
          description: Optional human-readable message.
    Claims:
      type: object
      description: JWT claims resolved server-side, surfaced via /auth/me.
      properties:
        tenantId:
          type: string
        branchId:
          type: string
        role:
          type: string
        permissions:
          type: array
          items:
            type: string
    ClockRequest:
      type: object
      description: Body for the PIN-based clock toggle.
      properties:
        userId:
          type: string
        pin:
          type: string
      required:
        - userId
        - pin
    CommissionType:
      type: string
      enum:
        - NONE
        - FLAT
        - PERCENTAGE
      description: How staff commission is computed for a service. Mirrors the Prisma enum.
      default: NONE
    ComparisonMetric:
      type: object
      properties:
        current:
          type: number
          format: double
        previous:
          type: number
          format: double
        changePercent:
          type: number
          format: double
          nullable: true
      required:
        - current
        - previous
        - changePercent
    CreateBranchInput:
      type: object
      description: Body for `POST /branches`. `tenantId` is injected from the session.
      properties:
        name:
          type: string
        address:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        invoiceFooter:
          type: string
          nullable: true
        isActive:
          type: boolean
          nullable: true
        latitude:
          type: number
          format: double
          nullable: true
        longitude:
          type: number
          format: double
          nullable: true
        whatsappLink:
          type: string
          nullable: true
        googleMapsLink:
          type: string
          nullable: true
        printerHost:
          type: string
          nullable: true
        printerPort:
          type: integer
          nullable: true
        printerName:
          type: string
          nullable: true
        printerEnabled:
          type: boolean
          nullable: true
        printerPaperSize:
          type: string
          nullable: true
        coverageEnd:
          type: string
          nullable: true
        isFreeTier:
          type: boolean
          nullable: true
        slug:
          type: string
          nullable: true
      required:
        - name
    CreateEventRequest:
      type: object
      description: Body for manual event creation (manager override).
      properties:
        userId:
          type: string
        type:
          type: string
          enum:
            - CLOCK_IN
            - CLOCK_OUT
          default: CLOCK_IN
        timestamp:
          type: string
          description: Optional ISO timestamp; server defaults to now.
          nullable: true
        notes:
          type: string
      required:
        - userId
    CreateOrderInput:
      type: object
      properties:
        customerId:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItemInput"
        notes:
          type: string
        discountType:
          type: string
        discountAmount:
          type: number
          format: double
        receivedAt:
          type: string
          nullable: true
          description: ISO-8601 or YYYY-MM-DD; defaults to now when omitted.
      required:
        - customerId
        - items
    CreateStockItemInput:
      type: object
      description: Body for `POST /stock-items`.
      properties:
        name:
          type: string
        unit:
          type: string
        currentQuantity:
          type: number
          format: double
          nullable: true
        lowStockThreshold:
          type: number
          format: double
          nullable: true
        purchasePricePerUnit:
          type: number
          format: double
          nullable: true
        isActive:
          type: boolean
          nullable: true
      required:
        - name
        - unit
    CreateStockMovementInput:
      type: object
      description: |
        Body for `POST /stock-items/{id}/movements`. `IN`/`OUT` must be positive;
        `ADJUSTMENT` may be signed. `date` defaults to now when omitted.
      properties:
        type:
          type: string
          enum:
            - IN
            - OUT
            - ADJUSTMENT
        quantity:
          type: number
          format: double
        notes:
          type: string
          nullable: true
        date:
          type: string
          format: date-time
          nullable: true
      required:
        - type
        - quantity
    Customer:
      type: object
      description: |
        A customer record. `phone`, `email`, `notes` are nullable pointers;
        `customerStatus` is derived (NEW/ACTIVE/AT_RISK/LAPSED). `orders` is
        populated only on the detail GET.
      properties:
        id:
          type: string
        name:
          type: string
        phone:
          type: string
          nullable: true
        email:
          type: string
          format: email
          nullable: true
        notes:
          type: string
          nullable: true
        balance:
          type: number
          format: double
        branchId:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        totalOrders:
          type: integer
        totalSpent:
          type: number
          format: double
        lastOrderDate:
          type: string
          format: date-time
          nullable: true
        customerStatus:
          type: string
          enum:
            - NEW
            - ACTIVE
            - AT_RISK
            - LAPSED
        orders:
          type: array
          items:
            $ref: "#/components/schemas/CustomerOrder"
      required:
        - id
        - name
        - balance
        - branchId
        - createdAt
        - updatedAt
        - totalOrders
        - totalSpent
        - customerStatus
    CustomerCreateInput:
      type: object
      properties:
        name:
          type: string
        phone:
          type: string
          nullable: true
        email:
          type: string
          format: email
          nullable: true
        notes:
          type: string
          nullable: true
        clientId:
          type: string
          nullable: true
          description: |
            Idempotency key (typically sent via the `X-Client-Id` header). When
            set, an existing customer is returned instead of creating a duplicate.
      required:
        - name
    CustomerDeposit:
      type: object
      description: |
        A single deposit transaction. `type` is one of
        TOP_UP | DEDUCTION | REFUND | ADJUSTMENT.
      properties:
        id:
          type: string
        customerId:
          type: string
        type:
          type: string
          enum:
            - TOP_UP
            - DEDUCTION
            - REFUND
            - ADJUSTMENT
        amount:
          type: number
          format: double
        balanceAfter:
          type: number
          format: double
        notes:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - customerId
        - type
        - amount
        - balanceAfter
        - createdAt
    CustomerDepositEnvelope:
      allOf:
        - $ref: "#/components/schemas/EnvelopeSuccess"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/CustomerDeposit"
    CustomerDepositListEnvelope:
      allOf:
        - $ref: "#/components/schemas/EnvelopeSuccess"
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/CustomerDeposit"
    CustomerDepositTopUpInput:
      type: object
      properties:
        amount:
          type: number
          format: double
          description: Must be > 0.
        type:
          type: string
          enum:
            - TOP_UP
            - DEDUCTION
            - REFUND
            - ADJUSTMENT
          default: TOP_UP
          description: Defaults to `TOP_UP` when omitted.
        description:
          type: string
          description: |
            Human-readable note for the transaction. Read first; falls back to
            `notes` when empty.
        notes:
          type: string
          description: Fallback note field (used when `description` is empty).
      required:
        - amount
    CustomerDetailEnvelope:
      allOf:
        - $ref: "#/components/schemas/EnvelopeSuccess"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/Customer"
    CustomerEnvelope:
      allOf:
        - $ref: "#/components/schemas/EnvelopeSuccess"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/Customer"
    CustomerInsights:
      type: object
      properties:
        total:
          type: integer
          format: int64
        newThisWeek:
          type: integer
          format: int64
        active:
          type: integer
          format: int64
        atRisk:
          type: integer
          format: int64
        lapsed:
          type: integer
          format: int64
      required:
        - total
        - newThisWeek
        - active
        - atRisk
        - lapsed
    CustomerListEnvelope:
      allOf:
        - $ref: "#/components/schemas/EnvelopeSuccess"
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/CustomerListItem"
    CustomerListItem:
      type: object
      description: |
        Curated list item for `/customers`. Drops `branchId`/`updatedAt` and
        surfaces order aggregates + derived `customerStatus`.
      properties:
        id:
          type: string
        name:
          type: string
        phone:
          type: string
          nullable: true
        email:
          type: string
          format: email
          nullable: true
        notes:
          type: string
          nullable: true
        balance:
          type: number
          format: double
        createdAt:
          type: string
          format: date-time
        totalOrders:
          type: integer
          format: int64
        totalSpent:
          type: number
          format: double
        lastOrderDate:
          type: string
          format: date-time
          nullable: true
        customerStatus:
          type: string
          enum:
            - NEW
            - ACTIVE
            - AT_RISK
            - LAPSED
      required:
        - id
        - name
        - balance
        - createdAt
        - totalOrders
        - totalSpent
        - customerStatus
    CustomerOrder:
      type: object
      description: One order in a customer's detail history.
      properties:
        id:
          type: string
        orderNumber:
          type: string
        status:
          type: string
        totalAmount:
          type: number
          format: double
        paidAmount:
          type: number
