  /telemetry:
    post:
      tags:
        - telemetry
      summary: Client-side event batch (errors persisted to ErrorLog)
      description: |
        Accepts a batch of client-side events. Events with `type: "error"` (or
        `level: "error"`) are persisted to `ErrorLog` so FE-only JS crashes show
        up in the super-admin error-logs viewer; other events are accepted +
        discarded (analytics placeholder). Rate-limited 100 events/min/user.
      operationId: postTelemetry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - events
              properties:
                events:
                  type: array
                  maxItems: 50
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                        example: error
                      level:
                        type: string
                        example: error
                      message:
                        type: string
                      url:
                        type: string
                      stack:
                        type: string
      responses:
        "204":
          description: Accepted (no content).
        "401":
          description: Authentication required.
        "429":
          description: Rate limit exceeded.
