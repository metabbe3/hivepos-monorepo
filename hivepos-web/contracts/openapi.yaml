            schema:
              $ref: "#/components/schemas/CustomerDepositTopUpInput"
      responses:
        "201":
          description: Created deposit transaction.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerDepositEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /customers/{id}/stats:
    get:
      tags:
        - customers
      summary: Get a customer's order aggregates
      operationId: getCustomerStats
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CustomerId"
      responses:
        "200":
          description: Customer stats.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerStatsEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /dashboard/heatmap:
    get:
      tags:
        - dashboard
      operationId: getDashboardHeatmap
      summary: Busy-hours heatmap + revenue trend
      description: |
        Returns four aggregates: top `customerVisits` (with per-day-of-week
        distribution), a 7×24 `hourlyByDay` order-count matrix, `revenueByDay`
        keyed by day-of-week, and a `revenueTrend` of the last 14 days
        (revenue, orders, plus a week-ago `previousRevenue` for comparison).
        Pass `branchId=ALL` to ignore the branch scope.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: branchId
          schema:
            type: string
          description: Branch scope; `ALL` disables scoping.
      responses:
        "200":
          description: The heatmap object.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HeatmapDataEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /dashboard/kanban:
    get:
      tags:
        - dashboard
      operationId: getDashboardKanban
      summary: Live order pipeline (kanban)
      description: |
        Flat order-detail rows (not status aggregates), newest first, capped at
        100. Each row carries customer, amount, payment + lifecycle
        timestamps, an `isExpress` flag, and its line `items`. Pass
        `branchId=ALL` to ignore the branch scope.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: branchId
          schema:
            type: string
          description: Branch scope; `ALL` disables scoping.
        - in: query
          name: module
          schema:
            type: string
            enum:
              - LAUNDRY
              - FNB
              - SALON
          description: Filter the pipeline to a module.
      responses:
        "200":
          description: Kanban order rows (bare array).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KanbanDataListEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /dashboard/stats:
    get:
      tags:
        - dashboard
      operationId: getDashboardStats
      summary: Aggregate dashboard metrics
      description: |
        Computed dashboard (today's orders/revenue, top customers, service +
        payment breakdowns, recent orders, cash flow, order pipeline, low
        stock, customer insights, period-over-period comparison, unpaid
        delivered orders, turnaround, and a 14-point sparkline). From/to
        default to the last 30 days. Server-cached for 5 minutes per tenant.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: module
          schema:
            type: string
            enum:
              - LAUNDRY
              - FNB
              - SALON
          description: Filter metrics to a module.
        - in: query
          name: from
          schema:
            type: string
            format: date
          description: Inclusive lower bound (YYYY-MM-DD). Defaults to today-30.
        - in: query
          name: to
          schema:
            type: string
            format: date
          description: Inclusive upper bound (YYYY-MM-DD). Defaults to today.
      responses:
        "200":
          description: The aggregate stats object.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStatsEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /demo/start:
    post:
      tags:
        - demo
      summary: Public demo entrypoint — shared demo credentials
      description: |
        Returns the shared seeded demo account credentials (`{ email, password }`) for the
        web `/demo` auto-signin flow. Body (with optional `email`) is accepted but ignored
        (lead-capture only). Rate-limited. `security: []` — public.
      operationId: startDemo
