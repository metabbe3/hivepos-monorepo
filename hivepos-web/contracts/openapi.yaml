          schema:
            type: string
        - in: query
          name: from
          schema:
            type: string
          description: Inclusive lower date bound (YYYY-MM-DD or RFC3339).
        - in: query
          name: to
          schema:
            type: string
          description: Inclusive upper date bound (YYYY-MM-DD or RFC3339).
        - in: query
          name: search
          schema:
            type: string
      responses:
        "200":
          description: Expense list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExpenseListEnvelope"
