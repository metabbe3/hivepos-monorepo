      description: |
        Returns service groups as a bare array under `data`. Intentionally
        unpaginated (no `meta`) to match the original TS `/api/service-groups`
        contract. `page`/`limit` query params are normalized but do not produce
        a `meta` block. Supports `branchId` and `module` filters.
      operationId: listServiceGroups
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: branchId
          schema:
            type: string
        - in: query
          name: module
          schema:
            type: string
          description: Module filter (e.g. `LAUNDRY`).
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 200
      responses:
        "200":
          description: Service group list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceGroupListEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags:
        - service-groups
      summary: Create a service group
      description: |
        Creates a new group against the branch resolved from the auth context.
        `name` is required. Defaults: `module` → `LAUNDRY`, `sortOrder` → `0`.
      operationId: createServiceGroup
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceGroupCreateInput"
      responses:
        "201":
          description: Created service group.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceGroupEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /service-groups/{id}:
    get:
      tags:
        - service-groups
      summary: Get a service group by ID
      operationId: getServiceGroup
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ServiceGroupId"
      responses:
        "200":
          description: The service group.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceGroupEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags:
        - service-groups
      summary: Update a service group
      description: |
        The server loads the existing group, JSON-decodes the body over it,
        re-pins `id`, and persists. Send only the fields you want to change.
      operationId: updateServiceGroup
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ServiceGroupId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceGroupUpdateInput"
      responses:
        "200":
          description: Updated service group.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceGroupEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags:
        - service-groups
      summary: Delete a service group
      operationId: deleteServiceGroup
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ServiceGroupId"
      responses:
        "204":
          description: Deleted — no content.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /services:
    get:
      tags:
        - services
      summary: List services for the current tenant
      description: |
        Returns services as a bare array under `data` using the curated
        `ServiceListItem` DTO (drops `branchId`, adds the nested `group`).
        Intentionally unpaginated (no `meta`) to match the original TS
        `/api/services` contract. Supports `branchId`, `module`, `search`,
        `active`, and `groupId` query filters.
      operationId: listServices
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: branchId
          schema:
            type: string
        - in: query
          name: module
          schema:
            type: string
          description: Module filter (e.g. `LAUNDRY`).
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: active
          schema:
            type: string
          description: Active filter (`true` / `false`).
        - in: query
          name: groupId
          schema:
            type: string
      responses:
        "200":
          description: Service list (curated items with nested `group`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceListEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags:
        - services
      summary: Create a service
      description: |
        Records a new service scoped to the branch resolved from the auth
        context. `name` is required. Defaults: `pricingType` → `PER_KG`,
        `commissionType` → `NONE`, `module` → `LAUNDRY`, `isActive` → `true`.
      operationId: createService
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceCreateInput"
      responses:
        "201":
          description: Created service.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /services/{id}:
    get:
      tags:
        - services
      summary: Get a service by ID
      description: Returns the full `Service` domain entity.
      operationId: getService
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ServiceId"
      responses:
        "200":
          description: The service.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags:
        - services
      summary: Update service fields
      description: |
        Partial update against a restricted input (NOT the full entity — prevents
        mass assignment / cross-tenant `branchId` moves). The server loads the
        existing service and applies only the fields the body supplies. Empty /
        zero / nil values are ignored (keeps the existing value) — this is also
        correct PATCH semantics and avoids the SQLSTATE 22P02 invalid-enum error
        on `pricingType`. `id` + `branchId` are preserved from the loaded entity.
      operationId: updateService
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ServiceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceUpdateInput"
      responses:
        "200":
          description: Updated service.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags:
        - services
      summary: Delete a service
      description: |
        Fails with `409 Conflict` when the service is referenced by order items —
        reassign or remove those order items first.
      operationId: deleteService
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ServiceId"
      responses:
        "204":
          description: Deleted — no content.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /stock-items:
    get:
      tags:
        - inventory
      summary: List stock items for the active branch/tenant
      description: |
        Returns every stock item visible to the caller, unpaginated (no `meta`).
