          schema:
            type: string
        - in: query
          name: status
          schema:
            $ref: "#/components/schemas/OrderStatus"
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: paymentStatus
          schema:
            $ref: "#/components/schemas/PaymentStatus"
        - in: query
          name: dateFrom
          schema:
            type: string
            format: date
        - in: query
          name: dateTo
          schema:
            type: string
            format: date
        - in: query
          name: sortBy
          schema:
            type: string
        - in: query
          name: sortOrder
          schema:
            type: string
            enum:
              - asc
              - desc
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Orders list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderListEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
