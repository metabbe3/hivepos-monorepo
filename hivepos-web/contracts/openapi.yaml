        - REJECTED
        - SCHEDULED
        - ASSIGNED
        - CONVERTED
        - CANCELED
    PickupStatusOkData:
      type: object
      description: Status-transition ack returned by accept/reject/schedule/assign/convert.
      properties:
        ok:
          type: boolean
          enum:
            - true
        status:
          $ref: "#/components/schemas/PickupStatus"
      required:
        - ok
        - status
    PickupStatusOkEnvelope:
      allOf:
        - $ref: "#/components/schemas/EnvelopeSuccess"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/PickupStatusOkData"
    PickupTransitionInput:
      type: object
      description: |
        Shared optional body for the accept/reject/schedule/assign/convert
        transitions. `scheduledDate` is required by `/schedule`; `assignedTo`
        is required by `/assign` and `/convert` (where it carries the created
        order id). `reason` is typically used by `/reject`. All fields optional
        in the schema itself; per-endpoint requirements are enforced server-side.
      properties:
        scheduledDate:
          type: string
          nullable: true
          description: "`YYYY-MM-DD` or RFC3339. Required by `/schedule`."
        scheduledSlot:
          type: string
          nullable: true
        assignedTo:
          type: string
          nullable: true
          description: Assignee id (for `/assign`) or created order id (for `/convert`). Required by both.
        reason:
          type: string
          nullable: true
    PricingType:
      type: string
      enum:
        - PER_KG
        - PER_ITEM
        - FLAT
      description: How a service is priced. Mirrors the Prisma enum.
      default: PER_KG
    PrinterResult:
      type: object
      description: |
        Printer endpoint response — always `{ success: false, error: { message } }` because
        printer hardware is device-local and unreachable from the backend. Matches the error
        envelope shape directly (no success `data`).
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            message:
              type: string
          required:
            - message
      required:
        - success
        - error
    PromoResult:
      type: object
      description: >
        Result of POST /billing/promo/validate. `valid` is the authoritative field; when false,
        `reason` explains why. Validation does NOT redeem.
      properties:
        valid:
          type: boolean
        reason:
          type: string
          description: Rejection reason when `valid` is false (e.g. not found, expired, usage exceeded).
        type:
          type: string
          description: Promo kind when valid. FREE_MONTH | DISCOUNT_PERCENT | DISCOUNT_FIXED.
          enum:
            - FREE_MONTH
            - DISCOUNT_PERCENT
            - DISCOUNT_FIXED
        value:
          type: number
          format: double
          description: >
            Promo magnitude — months (FREE_MONTH), percent (DISCOUNT_PERCENT), or currency amount
            (DISCOUNT_FIXED).
        promoCodeId:
          type: string
          description: Internal promo code ID (present when valid).
