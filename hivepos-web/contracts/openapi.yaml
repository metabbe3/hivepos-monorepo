        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /orders/{id}/status:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
        description: Order ID.
    post:
      tags:
        - orders
      summary: Advance / set order status (POST)
      description: |
        Transitions the order to the supplied status. Illegal transitions return
        400 with a message. When status becomes `READY`, a best-effort WhatsApp
        "ready for pickup" notice is fired.
      operationId: advanceOrderStatusPost
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  $ref: "#/components/schemas/OrderStatus"
              required:
                - status
      responses:
        "200":
          description: Status updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusOkEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags:
        - orders
      summary: Advance / set order status (PATCH, web status dialog)
      description: |
        Same handler as POST; the web's status dialog uses PATCH. Illegal
        transitions return 400.
      operationId: advanceOrderStatusPatch
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  $ref: "#/components/schemas/OrderStatus"
              required:
                - status
      responses:
        "200":
          description: Status updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusOkEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /pickup-requests:
    get:
      tags:
        - pickup
      summary: List pickup requests for the current tenant
      description: |
        Paginated list of pickup requests. Filterable by `branchId`, `status`,
        and `search`. Meta shape is `{ total, page, totalPages }` (no `limit`
        — `MetaNoLimit`). Page/limit are clamped (page >=1, limit 1..100,
        default 20).
      operationId: listPickupRequests
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: branchId
          schema:
            type: string
        - in: query
          name: status
          schema:
            $ref: "#/components/schemas/PickupStatus"
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Paginated pickup request list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PickupRequestListEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags:
        - pickup
      summary: Create a pickup request
      description: |
        Creates a PENDING pickup request. `branchId` is required — when omitted
        from the body it falls back to the request's branch context
        (`X-Branch-Id` / JWT claim). `customerPhone` and `address` are coerced
        to empty strings server-side (DB NOT NULL). `requestedDate` accepts
        `YYYY-MM-DD` or RFC3339.
      operationId: createPickupRequest
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PickupRequestCreateInput"
      responses:
        "201":
          description: Pickup request created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PickupRequestEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /pickup-requests/count-pending:
    get:
      tags:
        - pickup
      summary: Count pending pickup requests
      description: |
        Returns `{ count }` of PENDING pickup requests for the current tenant,
        optionally scoped to a branch via `branchId`.
      operationId: countPendingPickupRequests
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: branchId
          schema:
            type: string
      responses:
        "200":
          description: Pending count.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PickupPendingCountEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /pickup-requests/{id}:
    get:
      tags:
        - pickup
      summary: Get a pickup request by id
      operationId: getPickupRequest
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PickupRequestId"
      responses:
        "200":
          description: Pickup request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PickupRequestEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /pickup-requests/{id}/accept:
    post:
      tags:
        - pickup
      summary: Accept a pending pickup request
      description: Moves a PENDING request to ACCEPTED. No request body.
      operationId: acceptPickupRequest
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PickupRequestId"
      responses:
        "200":
          description: Request accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PickupStatusOkEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /pickup-requests/{id}/assign:
    post:
      tags:
        - pickup
      summary: Assign a pickup request to a driver/staff
      description: Moves a request to ASSIGNED. `assignedTo` is required.
      operationId: assignPickupRequest
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PickupRequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PickupTransitionInput"
      responses:
        "200":
          description: Request assigned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PickupStatusOkEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /pickup-requests/{id}/convert:
    post:
      tags:
        - pickup
      summary: Convert a pickup request into an order
      description: |
        Marks a request as CONVERTED and links the created order. The actual
        Order creation is the caller's responsibility (the orders module).
        `assignedTo` is repurposed here to carry the created order id and is
        required.
      operationId: convertPickupRequest
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PickupRequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PickupTransitionInput"
      responses:
        "200":
          description: Request converted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PickupStatusOkEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /pickup-requests/{id}/reject:
    post:
      tags:
        - pickup
      summary: Reject a pickup request
      description: |
        Moves a request to REJECTED. Optional body (e.g. a `reason`). Body is
        decoded leniently — a missing/empty body is allowed.
      operationId: rejectPickupRequest
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PickupRequestId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PickupTransitionInput"
      responses:
        "200":
          description: Request rejected.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PickupStatusOkEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /pickup-requests/{id}/schedule:
    post:
      tags:
        - pickup
      summary: Schedule a pickup request
      description: |
        Moves a request to SCHEDULED. `scheduledDate` is required; `scheduledSlot`
        is optional.
      operationId: schedulePickupRequest
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PickupRequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PickupTransitionInput"
      responses:
        "200":
          description: Request scheduled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PickupStatusOkEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /printers/scan:
    post:
      tags:
        - printers
      summary: Auto-scan for local printers (device-local)
      description: |
        Printer auto-scan is device-local hardware the backend cannot reach. Always returns
        `{ success: false, error: { message } }` instructing manual IP configuration.
        Public (`security: []`) — no session required.
      operationId: scanPrinters
      security: []
      responses:
        "200":
          description: Device-required error (manual IP guidance).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrinterResult"
  /printers/test:
    post:
      tags:
        - printers
      summary: Test a local printer (device-local)
      description: |
        Printer self-test is device-local hardware the backend cannot reach. Always returns
        `{ success: false, error: { message } }` instructing the printer's built-in self-test.
        Public (`security: []`) — no session required.
      operationId: testPrinter
      security: []
      responses:
        "200":
          description: Device-required error (built-in self-test guidance).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrinterResult"
  /public/blog-posts:
    get:
      tags:
        - public
        - blog
      summary: List published blog posts
      description: |
        Returns all published posts (newest first) for the public blog + sitemap.
        Bare array under `data`. Used by `/blog`, the related-posts list, and
        `sitemap.ts`.
      operationId: listPublicBlogPosts
      security: []
      responses:
        "200":
          description: Published posts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlogPostListEnvelope"
        "404":
          $ref: "#/components/responses/NotFound"
  /public/blog-posts/{slug}:
    get:
      tags:
        - public
        - blog
      summary: Get a single published blog post by slug
      operationId: getPublicBlogPost
      security: []
      parameters:
        - in: path
          name: slug
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The post.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlogPostEnvelope"
        "404":
          $ref: "#/components/responses/NotFound"
  /public/branches:
    get:
      tags:
        - public
      summary: Public branch directory for a tenant
      description: |
        Returns the public-facing branch list (slug, name, address, phone, operating hours,
        geo, WhatsApp/Google Maps links, tenant name) resolved by tenant slug.
        Slug is required via `?slug=` or `X-Tenant-Slug` header.
      operationId: listPublicBranches
      security: []
      parameters:
        - name: slug
          in: query
          required: true
          schema:
            type: string
          description: Tenant slug (also accepted via `X-Tenant-Slug` header).
      responses:
        "200":
          description: Public branch list (bare array).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/EnvelopeSuccess"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/PublicBranch"
        "400":
          $ref: "#/components/responses/BadRequest"
  /public/orders/track:
    get:
      tags:
        - public
      summary: Track a public order by order number
      description: |
        Returns the public order-tracking view (no customer PII) by `orderNumber`.
        Optional `phone` query param is last-4 verification. Returns the order or 404.
      operationId: trackPublicOrder
      security: []
      parameters:
        - name: orderNumber
          in: query
          required: true
          schema:
            type: string
        - name: phone
          in: query
          required: false
          schema:
            type: string
          description: Optional phone — only the last 4 characters are used for verification.
      responses:
        "200":
          description: Tracked order (no customer PII).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderTrackingEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /public/pickup-requests:
    post:
      tags:
        - public
      summary: Submit a public pickup request
      description: |
        Creates a public pickup request. `name`, `phone`, and `tenantSlug` are required.
        `tenantSlug` may come from the body or the `?slug=` / `X-Tenant-Slug` header (body wins).
        Returns `{ requestId, status }` (status starts as `PENDING`).
      operationId: createPublicPickupRequest
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicPickupInput"
      responses:
        "201":
          description: Pickup request created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicPickupResultEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
  /public/services:
    get:
      tags:
        - public
      summary: Public service catalog for a tenant
      description: |
        Returns the public service catalog (optionally filtered to a branch) resolved by
        tenant slug. Wrapped as `{ services: [...] }`. Slug is required via `?slug=` or
        `X-Tenant-Slug` header.
      operationId: listPublicServices
      security: []
      parameters:
        - name: slug
          in: query
          required: true
          schema:
            type: string
          description: Tenant slug (also accepted via `X-Tenant-Slug` header).
        - name: branchId
          in: query
          required: false
          schema:
            type: string
          description: Optional branch id to scope the catalog.
      responses:
        "200":
          description: Public service catalog wrapper.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicServiceCatalogEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
  /public/tenants/{slug}:
    get:
      tags:
        - public
      summary: Public tenant website payload by slug
      description: |
        Returns tenant identity + dashboard `settings` block (website/hero/qris/google/…)
        plus the branch directory with geo/contact/links/operating-hours. Resolved by slug
        (no auth). `settings` is opaque JSON (dashboard website config).
      operationId: getPublicTenant
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
          description: Tenant slug (also accepted via `?slug=` or `X-Tenant-Slug` header).
      responses:
        "200":
          description: Public tenant payload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicTenantEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /public/tickets:
    post:
      tags:
        - public
      summary: Submit a public support ticket
      description: |
        Creates a public support ticket. `name`, `email`, and `message` are required;
        `tenantSlug` is optional (tenant context). Returns the new `{ ticketId, status }`
        (status starts as `OPEN`).
      operationId: createPublicTicket
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicTicketInput"
      responses:
        "201":
          description: Ticket created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicTicketResultEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
  /pwa/nonce:
    get:
      tags:
        - pwa
      summary: PWA service-worker nonce
      description: |
        Returns the PWA nonce (`{ nonce }`). Public — polled by the service worker's
