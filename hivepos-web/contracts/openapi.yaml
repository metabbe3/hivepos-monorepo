  /super-admin/ai/chat:
    get:
      tags:
        - super-admin
      summary: Get AI assistant config
      description: |
        Returns whether the AI assistant is enabled (an AI key is configured) and
        the configured model name.
      operationId: superAdminGetAiChatConfig
      security:
        - bearerAuth: []
      responses:
        "200":
          description: AI assistant config.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiChatConfigEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags:
        - super-admin
      summary: Chat with the AI assistant (SSE stream)
      description: |
        Streams the FE's SSE protocol: `data: {"type":"delta","content":...}`
        frames followed by `data: [DONE]`. Calls an OpenAI-compatible
        `/chat/completions` endpoint when a key is set; otherwise emits a
        disabled-notice delta. The 200 response is `text/event-stream` — NO
        response envelope.
      operationId: superAdminAiChat
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SuperAdminAiChatInput"
      responses:
        "200":
          description: SSE stream of chat deltas.
          content:
            text/event-stream:
              schema:
                type: string
                description: |
                  `data: {"type":"delta","content":"..."}\n\n` frames terminated
                  by `data: [DONE]\n\n`.
        "401":
          $ref: "#/components/responses/Unauthorized"
