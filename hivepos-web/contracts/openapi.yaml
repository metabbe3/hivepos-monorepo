        - reports
      operationId: getReportAttendance
      summary: Employee attendance report (paginated with date window meta)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/FromDate"
        - $ref: "#/components/parameters/ToDate"
        - $ref: "#/components/parameters/StartDateAlias"
        - $ref: "#/components/parameters/EndDateAlias"
        - $ref: "#/components/parameters/BranchId"
      responses:
        "200":
          description: Attendance report
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/EnvelopeSuccess"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/ReportAttendanceRow"
                      meta:
                        type: object
                        properties:
                          from:
                            type: string
                            format: date-time
                            description: Window start (echoed `from`, or 1 month ago when omitted).
                          to:
                            type: string
                            format: date-time
                            description: Window end (echoed `to`, or now when omitted).
                          totalWorkDays:
                            type: integer
                            description: Number of work days in the window (currently fixed at 27).
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
