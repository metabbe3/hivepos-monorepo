      description: |
        Records a new expense against the branch resolved from the auth context.
        `date` is optional (defaults to now); accepted as `YYYY-MM-DD` or RFC3339.
        `amount` must be positive.
      operationId: createExpense
      security:
        - bearerAuth: []
      requestBody:
